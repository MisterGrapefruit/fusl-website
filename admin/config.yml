backend:
  name: github
  repo: MisterGrapefruit/fusl-website
  branch: main

media_folder: "images"
public_folder: "/images"

locale: "nl"

collections:
  - name: "home"
    label: "Homepage"
    files:
      - file: "data/home-content.json"
        label: "Hero-tekst"
        name: "home_hero"
        fields:
          - { label: "Titel — regel 1", name: "heroTitleLine1", widget: "string" }
          - { label: "Titel — regel 2", name: "heroTitleLine2", widget: "string" }
          - { label: "Tekst onder de titel", name: "heroText", widget: "text" }
          - { label: "Tekst in Capy's spreekbubbel", name: "mascotSpeech", widget: "string" }

  - name: "over_ons"
    label: "Over ons"
    files:
      - file: "data/over-ons-content.json"
        label: "Verhaal, doelen & reacties"
        name: "over_ons_content"
        fields:
          - { label: "Ons verhaal — alinea 1", name: "verhaalIntro1", widget: "text" }
          - { label: "Ons verhaal — alinea 2", name: "verhaalIntro2", widget: "text" }
          - { label: "Doel 'Betaalbaar' — titel", name: "doelBetaalbaarTitel", widget: "string" }
          - { label: "Doel 'Betaalbaar' — tekst", name: "doelBetaalbaarTekst", widget: "text" }
          - { label: "Doel 'Gemak' — titel", name: "doelGemakTitel", widget: "string" }
          - { label: "Doel 'Gemak' — tekst", name: "doelGemakTekst", widget: "text" }
          - { label: "Doel 'Duurzaamheid' — titel", name: "doelDuurzaamheidTitel", widget: "string" }
          - { label: "Doel 'Duurzaamheid' — tekst", name: "doelDuurzaamheidTekst", widget: "text" }
          - { label: "Titel van de reactiesectie", name: "testimonialsTitel", widget: "string" }
          - { label: "Introzin boven de reacties", name: "testimonialsIntro", widget: "text" }
          - { label: "Reactie 1 — tekst", name: "testimonial1Quote", widget: "text" }
          - { label: "Reactie 1 — naam/ondertekening", name: "testimonial1Auteur", widget: "string" }
          - { label: "Reactie 2 — tekst", name: "testimonial2Quote", widget: "text" }
          - { label: "Reactie 2 — naam/ondertekening", name: "testimonial2Auteur", widget: "string" }
          - { label: "Reactie 3 — tekst", name: "testimonial3Quote", widget: "text" }
          - { label: "Reactie 3 — naam/ondertekening", name: "testimonial3Auteur", widget: "string" }
